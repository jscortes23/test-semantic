name: Weekly dependency audit

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run audit and sync issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Dependency audit
        run: |
          issue=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")

          if pnpm audit --audit-level=high > audit.txt 2>&1; then
            {
              echo "### Dependency audit: no high or critical vulnerabilities"
              echo '```'
              head -c 900000 audit.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "The weekly audit found no high or critical vulnerabilities. Closing."
            fi
            exit 0
          fi

          # Issue bodies are capped at 65,536 characters, so the issue gets a compact table
          # and the full output stays in the Job Summary (capped at 1 MiB).
          pnpm audit --json > audit.json 2>/dev/null || true
          node scripts/audit-summary.mjs audit.json \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > audit-body.md
          {
            cat audit-body.md
            echo ""
            echo "<details><summary>Full pnpm audit output</summary>"
            echo ""
            echo '```'
            head -c 900000 audit.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file audit-body.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file audit-body.md
          fi
