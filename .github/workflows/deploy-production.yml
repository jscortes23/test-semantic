name: Deploy production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to deploy (empty = latest stable tag)
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require repository admin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          permission=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission" --jq .permission)
          if [ "$permission" != "admin" ]; then
            echo "::error::Only repository admins can deploy to production (your permission: $permission)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve tag
        id: tag
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -v -- '-' | head -n1)
          fi
          if [ -z "$tag" ] || ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag '$tag' not found."
            exit 1
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"
      - run: git checkout "${{ steps.tag.outputs.value }}"
      - uses: ./.github/actions/setup
      - name: Build production
        # This repo uses no VITE_* variables yet. Add them with the _PRODUCTION suffix, e.g.:
        # env:
        #   VITE_API_URL: ${{ secrets.VITE_API_URL_PRODUCTION }}
        run: pnpm build:production
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Publish to deploy/production
        env:
          DEPLOY_TOKEN: ${{ steps.app.outputs.token }}
        run: ./scripts/publish-dist.sh deploy/production "${{ steps.tag.outputs.value }}"
